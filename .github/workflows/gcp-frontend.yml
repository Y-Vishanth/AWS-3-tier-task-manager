name: Deploy Frontend to GCS
on:
  push:
    branches:
      - feature/gcp
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
    # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4
    # Set up Node.js environment
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

     # Install project dependencies
      - name: Install Dependencies
        run: npm install

     # Build the React application
      - name: Build React App
        run: npm run build
    # Authenticate with GCP and set up gcloud CLI
      - name: Authenticate GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
    # Set up gcloud CLI
      - name: Setup GCloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
    # Upload the build files to GCS
      - name: Upload Build Files to GCS
        run: |
          gsutil -m rsync -r -d dist gs://${{ vars.GCS_BUCKET_NAME }}
    # Invalidate Cloud CDN cache to ensure the latest content is served
      - name: Invalidate Cloud CDN Cache
        run: |
          gcloud compute url-maps invalidate-cdn-cache \
            ${{ vars.URL_MAP_NAME }} \
            --path "/*" \
            --async